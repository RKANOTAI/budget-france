[project]
name = "budget-france"
version = "0.1.0"
description = "Contrats et API du budget général de l'État français"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.11,<1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["packages/contracts/schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["api", "scripts", "tests/contracts"]
strict = true
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
